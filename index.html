<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Довідник послуг з підтримки ментального здоров'я в Олександрійській громаді</title>
<meta name="description" content="Заклади та організації Олександрійської громади, які надають послуги з підтримки ментального здоров'я: адреси, телефони, графік роботи.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============ НАЛАШТУВАННЯ КОЛЬОРІВ ============ */
:root{
  --blue:#3A6098;
  --blue-dark:#2C4A77;
  --peach:#FDDBA5;
  --peach-soft:#FEEACB;
  --orange:#F2A15C;
  --teal:#8BA7A8;
  --tape:#DCCBA4;
  --ink:#2E2B29;
  --muted:#5D5853;
  --paper:#FFFFFF;
  --radius:22px;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Open Sans","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- верхня панель ---------- */
.topbar{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{font-family:var(--serif);font-weight:600;text-decoration:none;font-size:1.02rem;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.78rem;opacity:.85}
.nav{display:flex;gap:6px;flex-shrink:0}
.nav a{text-decoration:none;padding:8px 14px;border-radius:999px;font-size:.92rem;font-weight:600;white-space:nowrap}
.nav a:hover,.nav a[aria-current="page"]{background:rgba(255,255,255,.18)}

/* ---------- головна: герой ---------- */
.hero{position:relative;overflow:hidden;padding:40px 0 30px}
.hero .waves{position:absolute;right:-10px;top:-6px;width:300px;height:220px;opacity:.95;pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:0;position:relative}
.hero-panel{background:var(--blue);color:#fff;border-radius:0 26px 26px 0;padding:56px 56px 56px 0;margin-left:calc((100vw - min(1180px,100vw - 32px))/-2);padding-left:calc((100vw - min(1180px,100vw - 32px))/2 + 8px);min-height:360px;display:flex;align-items:center}
.hero-panel h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,3.1vw,2.8rem);line-height:1.12;margin:0;text-align:center;width:100%}
.hero-ill{margin-left:-10px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.12))}

/* ---------- головна: пошук ---------- */
.search-sec{background:var(--peach);padding:56px 0 40px;position:relative;overflow:hidden}
.search-sec h2{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--blue);font-size:clamp(1.6rem,3vw,2.4rem);margin:0 0 20px;text-align:center}
.search-box{position:relative;max-width:760px;margin:0 auto}
.search-box svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--blue)}
.search-box input{width:100%;font:inherit;font-size:1.08rem;padding:18px 48px 18px 56px;border-radius:16px;border:1px solid #E7CFA5;background:#fff;box-shadow:0 8px 24px rgba(120,80,20,.12);outline:none;color:var(--ink)}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(58,96,152,.18),0 8px 24px rgba(120,80,20,.12)}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search-box .clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:1.5rem;line-height:1;color:var(--muted);cursor:pointer;padding:6px 10px;display:none}
.hint{font-style:italic;color:#4A4540;text-align:center;margin:16px auto 0;max-width:760px;font-size:1.02rem}
.chips-quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips-quick button{font:inherit;font-size:.9rem;border:1px solid rgba(58,96,152,.35);background:rgba(255,255,255,.65);color:var(--blue-dark);padding:6px 14px;border-radius:999px;cursor:pointer}
.chips-quick button:hover{background:#fff}
.results{margin-top:30px}
.results-head{font-weight:600;color:var(--blue-dark);margin:0 0 14px}
.empty{background:rgba(255,255,255,.7);border-radius:16px;padding:18px 20px;color:var(--muted)}

/* ---------- заклик до змісту ---------- */
.cta{background:var(--peach);padding:10px 0 70px;position:relative;overflow:hidden}
.cta-line{display:flex;align-items:center;gap:16px;background:var(--peach-soft);border-radius:999px;padding:12px 26px 12px 12px}
.cta-line .arrow{flex-shrink:0;width:54px;height:54px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.cta-line p{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.1vw,1.55rem);color:#3E3A36}
.cta-row{display:flex;justify-content:flex-end;margin-top:22px;position:relative;z-index:1}
.btn-big{display:inline-flex;align-items:center;gap:14px;text-decoration:none;background:#fff;border:2px solid #222;border-radius:22px;padding:14px 26px;font-family:var(--serif);font-weight:700;font-size:clamp(1.4rem,3vw,2.2rem);color:#3E3A36;box-shadow:12px 12px 0 #CFCAC6;transition:transform .15s,box-shadow .15s}
.btn-big:hover{transform:translate(3px,3px);box-shadow:8px 8px 0 #CFCAC6}
.btn-big svg{width:42px;height:42px;color:var(--blue)}
.cta .arches{position:absolute;left:12%;bottom:-6px;width:260px;color:var(--blue);opacity:.9}

/* ---------- кнопка «повернутися» ---------- */
.back{display:inline-block;text-decoration:none;background:#fff;border:1.5px solid #333;border-radius:12px;padding:8px 16px;font-family:var(--serif);font-size:.98rem;box-shadow:5px 5px 0 rgba(0,0,0,.18);color:#333}
.back:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(0,0,0,.18)}

/* ---------- сторінка змісту ---------- */
.page-zmist{background:var(--teal);min-height:calc(100vh - 58px);padding:30px 0 70px;position:relative;overflow:hidden}
.page-zmist .drop{position:absolute;color:#DCCBA4;opacity:.9;pointer-events:none}
.zmist-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px;position:relative;z-index:1}
.zmist-top h1{font-family:var(--serif);color:#fff;font-weight:600;margin:0;font-size:clamp(1.7rem,3vw,2.3rem)}
.sticker-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 36px;max-width:820px;margin:0 auto;position:relative;z-index:1}
.sticker{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;min-height:112px;padding:18px 18px 16px 44px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.08);transition:transform .15s}
.sticker:hover{transform:translateY(-3px) rotate(-.4deg)}
.sticker::before{content:"";position:absolute;left:-26px;top:-14px;width:96px;height:34px;background:var(--tape);transform:rotate(-38deg);clip-path:polygon(4% 0,96% 0,100% 18%,95% 36%,100% 55%,94% 75%,100% 100%,4% 100%,0 80%,5% 60%,0 40%,6% 20%);opacity:.95}
.sticker b{font-family:var(--serif);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.1;color:var(--c)}
.sticker span{font-size:.85rem;color:var(--muted);margin-top:6px}

/* ---------- сторінка сектора ---------- */
.page-sector{background:var(--bg);min-height:calc(100vh - 58px);padding:26px 0 70px;position:relative;overflow:hidden}
.page-sector .rings{position:absolute;right:-60px;bottom:40px;width:340px;color:var(--c);opacity:.25;pointer-events:none}
.sector-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px;position:relative;z-index:1}
.title-card{position:relative;background:#fff;padding:18px 34px 18px 70px;min-width:min(440px,100%)}
.title-card::before{content:"";position:absolute;left:-14px;top:-12px;width:110px;height:40px;background:var(--c);transform:rotate(-40deg);clip-path:polygon(4% 0,96% 0,100% 18%,95% 36%,100% 55%,94% 75%,100% 100%,4% 100%,0 80%,5% 60%,0 40%,6% 20%)}
.title-card h1{margin:0;font-family:var(--serif);font-weight:700;color:var(--c);font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.1}
.title-card p{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.filter{position:relative;max-width:520px;margin:0 0 22px;z-index:1}
.filter input{width:100%;font:inherit;padding:12px 16px 12px 44px;border-radius:12px;border:1px solid rgba(0,0,0,.12);background:#fff;outline:none}
.filter input:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.filter svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--c)}

/* ---------- картки організацій ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;position:relative;z-index:1}
.card{background:var(--c);color:#fff;border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.10)}
.card h3{margin:0;font-family:var(--serif);font-weight:600;font-size:1.14rem;line-height:1.28}
.card .sector-tag{align-self:flex-start;font-size:.74rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;text-decoration:none}
.card .services{margin:0;font-style:italic;font-size:.95rem;opacity:.96}
.card .services.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .more{align-self:flex-start;background:none;border:0;color:#fff;text-decoration:underline;font:inherit;font-size:.85rem;padding:0;cursor:pointer;opacity:.9}
.card dl{margin:4px 0 0;display:grid;grid-template-columns:22px 1fr;gap:7px 10px;font-size:.93rem}
.card dt{opacity:.85;padding-top:2px}
.card dt svg{width:18px;height:18px}
.card dd{margin:0;word-break:break-word}
.card dd a{color:#fff;text-underline-offset:2px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.card .tags span{font-size:.78rem;background:rgba(255,255,255,.92);color:var(--c);font-weight:700;padding:3px 10px;border-radius:999px}
mark{background:#FFE08A;color:inherit;border-radius:3px;padding:0 1px}

/* ---------- футер ---------- */
footer{background:var(--blue-dark);color:#E6ECF5;padding:26px 0;font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.notice{background:#FFF4D6;border:1px solid #F0D58C;color:#6B5313;border-radius:12px;padding:10px 14px;margin:0 0 18px;font-size:.9rem}

/* ---------- мобільна версія ---------- */
@media (max-width:860px){
  .hero{padding:0 0 10px}
  .hero-grid{grid-template-columns:1fr}
  .hero-panel{border-radius:0 0 26px 26px;margin-left:-16px;margin-right:-16px;padding:40px 22px;min-height:0}
  .hero-ill{margin:-20px auto 0;width:min(560px,96%)}
  .hero .waves{display:none}
  .cta-row{justify-content:center}
  .cta .arches{display:none}
}
@media (max-width:640px){
  .brand{font-size:.92rem}
  .brand small{display:none}
  .nav a{padding:7px 10px;font-size:.85rem}
  .nav a.nav-home{display:none}
  .search-sec{padding:36px 0 30px}
  .sticker-grid{grid-template-columns:1fr;gap:22px}
  .sticker{min-height:84px}
  .zmist-top,.sector-head{flex-direction:column-reverse;align-items:stretch}
  .zmist-top .back,.sector-head .back{align-self:flex-end}
  .title-card{padding:16px 20px 16px 58px}
  .cards{grid-template-columns:1fr}
  .cta-line{border-radius:22px;padding:12px 16px 12px 12px}
  .cta-line .arrow{width:44px;height:44px}
  .btn-big{box-shadow:8px 8px 0 #CFCAC6}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[ʼ’`´]/g,"'").replace(/ё/g,"е").replace(/\s+/g," ").trim();
const EMPTY = /^(немає|не має|нема|відсутн\S*( телефон)?|n\/?a|-|—|–|\.)$/i;
const clean = v => { v = String(v ?? "").trim(); return EMPTY.test(v) ? "" : v; };

/* ---------- розбір CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=""; }
    else if(c=='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!='\r') f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const COLS = [
  ["sector",/сектор/i],["name",/назв/i],["address",/адрес/i],["hours",/графік|години/i],
  ["web",/сайт|соцмереж|посилан/i],["phone",/телефон/i],["description",/опис/i],
  ["services",/послуг/i],["format",/форм[аи] надання|формат/i],["paid",/платн|вартість/i],
];
function rowsToOrgs(rows){
  const head=rows[0].map(h=>h.trim()); const idx={};
  COLS.forEach(([key,re])=>{ const i=head.findIndex((h,j)=>re.test(h)&&!Object.values(idx).includes(j)); if(i>-1) idx[key]=i; });
  return rows.slice(1).map(r=>{ const o={}; COLS.forEach(([k])=>o[k]= idx[k]!=null ? (r[idx[k]]||"").trim() : ""); return o; });
}

/* ---------- підготовка даних ---------- */
function sectorsOf(raw){
  const s=norm(raw); if(!s) return ["inshe"];
  const parts=s.split(/,|;/).map(x=>x.trim()).filter(Boolean);
  const out=new Set();
  parts.forEach(p=>{
    let hit=SECTORS.find(S=>norm(S.name)===p);
    if(!hit) hit=SECTORS.filter(S=>S.slug!=="osvita").find(S=>S.match.some(m=>p.includes(m)));
    if(!hit && p.includes("освіт")) hit=SECTORS.find(S=>S.slug==="osvita");
    out.add(hit?hit.slug:"inshe");
  });
  return [...out];
}
function prepare(list){
  const byKey=new Map();
  list.forEach(o=>{
    const name=clean(o.name); if(!name) return;
    const key=norm(name).replace(/[«»"“”„'()\-–—.,№\s]/g,"");
    byKey.set(key,{...o,name}); /* дублікат → лишається останній запис */
  });
  return [...byKey.values()].map((o,i)=>{
    const services=clean(o.services), desc=clean(o.description);
    const text = desc && !norm(services).includes(norm(desc)) && !norm(desc).includes(norm(services)) ? [services,desc].filter(Boolean).join(" ") : (desc.length>services.length?desc:services);
    const org={id:i,name:o.name,sectors:sectorsOf(o.sector),address:clean(o.address),hours:clean(o.hours),
      web:clean(o.web),phone:clean(o.phone),text,format:clean(o.format),paid:clean(o.paid)};
    org.hay=norm([org.name,org.text,org.address,org.format,org.paid,org.sectors.map(s=>sec(s).name).join(" ")].join(" "));
    return org;
  });
}
const sec = slug => SECTORS.find(s=>s.slug===slug) || SECTORS[SECTORS.length-1];
const tint = (hex,a) => { const n=parseInt(hex.slice(1),16); const r=n>>16,g=n>>8&255,b=n&255; const m=c=>Math.round(c+(255-c)*a); return `rgb(${m(r)},${m(g)},${m(b)})`; };

/* ---------- відображення полів ---------- */
function phonesHTML(p){
  if(!p) return "";
  let out=esc(p);
  const re=/(\+?\s?3?8?\s?\(?0\d{2}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}|\+?380\d{9}|\b0\d{9}\b)/g;
  return out.replace(re,m=>{ const lead=m.match(/^\s*/)[0]; m=m.trim(); let d=m.replace(/\D/g,""); if(d.length<10) return lead+m; if(d.startsWith("0")) d="38"+d; if(d.startsWith("80")) d="3"+d; return `${lead}<a href="tel:+${d}">${m}</a>`; });
}
function webHTML(w){
  if(!w) return "";
  const urls=w.match(/(https?:\/\/[^\s,;]+|www\.[^\s,;]+|[\w.+-]+@[\w-]+\.[\w.]+)/gi);
  if(!urls) return esc(w);
  return urls.map(u=>{
    if(u.includes("@")&&!u.startsWith("http")) return `<a href="mailto:${esc(u)}">${esc(u)}</a>`;
    const href=u.startsWith("http")?u:"https://"+u;
    let label="Сайт";
    if(/instagram/i.test(u)) label="Instagram"; else if(/facebook|fb\.com/i.test(u)) label="Facebook"; else if(/t\.me|telegram/i.test(u)) label="Telegram"; else if(/youtube/i.test(u)) label="YouTube";
    else { try{ label=new URL(href).hostname.replace(/^www\./,""); }catch(e){} }
    return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  }).join(", ");
}
function hl(text,terms){
  let h=esc(text); if(!terms||!terms.length) return h;
  terms.forEach(t=>{ if(t.length<2) return; const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"); h=h.replace(re,"<mark>$1</mark>"); });
  return h;
}
function cardHTML(o,{showSector=false,terms=[],color}={}){
  const c=color||sec(o.sectors[0]).color;
  const mapQ=encodeURIComponent(/олександрі/i.test(o.address)?o.address:"Олександрія, "+o.address);
  const rows=[];
  if(o.address) rows.push(`<dt title="Адреса">${icons.pin}</dt><dd>${/офіс/i.test(o.address)?hl(o.address,terms):`<a href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener">${hl(o.address,terms)}</a>`}</dd>`);
  if(o.hours) rows.push(`<dt title="Графік роботи">${icons.clock}</dt><dd>${esc(o.hours)}</dd>`);
  if(o.phone) rows.push(`<dt title="Телефон">${icons.phone}</dt><dd>${phonesHTML(o.phone)}</dd>`);
  if(o.web) rows.push(`<dt title="Сайт / соцмережі">${icons.web}</dt><dd>${webHTML(o.web)}</dd>`);
  const tags=[...(o.format?o.format.split(/,\s*/):[]),o.paid].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join("");
  const long=o.text.length>230;
  return `<article class="card" style="--c:${c}">
    ${showSector?o.sectors.map(s=>`<a class="sector-tag" href="#${sec(s).slug}">${esc(sec(s).name)}</a>`).join(""):""}
    <h3>${hl(o.name,terms)}</h3>
    ${o.text?`<p class="services${long?" clamp":""}">${hl(o.text,terms)}</p>${long?'<button class="more" type="button">Показати повністю</button>':""}`:""}
    ${rows.length?`<dl>${rows.join("")}</dl>`:""}
    ${tags?`<div class="tags">${tags}</div>`:""}
  </article>`;
}

/* ---------- декоративні елементи ---------- */
const wavesSVG = `<svg class="waves" viewBox="0 0 300 220" aria-hidden="true">${Array.from({length:9},(_,i)=>`<path d="M${30+i*30} 0 c-14 18 14 30 0 48 s14 30 0 48 s14 30 0 48 s14 30 0 48" fill="none" stroke="#F2A15C" stroke-width="7" stroke-linecap="round"/>`).join("")}</svg>`;
const archesSVG = `<svg class="arches" viewBox="0 0 260 140" aria-hidden="true">${[0,1,2,3,4,5].map(i=>`<path d="M${10+i*17} 140 A${120-i*17} ${120-i*17} 0 0 1 ${250-i*17} 140" fill="none" stroke="currentColor" stroke-width="9"/>`).join("")}</svg>`;
const ringsSVG = `<svg class="rings" viewBox="0 0 340 340" aria-hidden="true">${[0,1,2,3,4,5].map(i=>`<circle cx="170" cy="170" r="${160-i*24}" fill="none" stroke="currentColor" stroke-width="9"/>`).join("")}</svg>`;
const dropSVG = (style) => `<svg class="drop" style="${style}" viewBox="0 0 220 180" aria-hidden="true">${[0,1,2,3,4].map(i=>`<path d="M${20+i*12} 90 L${110} ${10+i*12} A${80-i*12} ${80-i*12} 0 1 1 ${110} ${170-i*12} Z" fill="none" stroke="currentColor" stroke-width="7"/>`).join("")}</svg>`;

/* ---------- сторінки ---------- */
function renderHome(){
  $app.innerHTML = `
  <section class="hero">
    ${wavesSVG}
    <div class="wrap hero-grid">
      <div class="hero-panel"><h1>Довідник послуг з підтримки ментального здоров’я в Олександрійській громаді</h1></div>
      <img class="hero-ill" src="${ILLUSTRATION}" alt="Ілюстрація: карта громади з секторами послуг — освіта, охорона здоров'я, соціальний захист, культура, молодь та спорт та інші">
    </div>
  </section>
  <section class="search-sec" id="poshuk">
    <div class="wrap">
      <h2>Знайдіть підтримку, яка вам потрібна</h2>
      <div class="search-box" role="search">
        ${icons.search}
        <label class="sr-only" for="q">Пошук по довіднику</label>
        <input id="q" type="search" placeholder="Яку допомогу ви шукаєте?" autocomplete="off">
        <button class="clear" type="button" aria-label="Очистити пошук">×</button>
      </div>
      <p class="hint">Не обов'язково вводити повне речення — достатньо кількох слів, які описують ваш запит.</p>
      <div class="chips-quick" aria-label="Приклади запитів">
        ${["психолог","залежність","діти з інвалідністю","ветерани","молодь","безоплатно"].map(t=>`<button type="button">${t}</button>`).join("")}
      </div>
      <div class="results" id="results" aria-live="polite"></div>
    </div>
  </section>
  <section class="cta">
    ${archesSVG}
    <div class="wrap">
      <div class="cta-line"><span class="arrow">${icons.arrow}</span><p>Не знайшли потрібного? Перейдіть до категорій послуг і оберіть самостійно:</p></div>
      <div class="cta-row"><a class="btn-big" href="#zmist">Сектор послуг ${icons.cursor}</a></div>
    </div>
  </section>`;
  const q=document.getElementById("q"), clr=$app.querySelector(".clear");
  const run=()=>{ clr.style.display=q.value?"block":"none"; doSearch(q.value); };
  q.addEventListener("input",run);
  clr.addEventListener("click",()=>{ q.value=""; run(); q.focus(); });
  $app.querySelectorAll(".chips-quick button").forEach(b=>b.addEventListener("click",()=>{ q.value=b.textContent; run(); }));
}
function doSearch(value){
  const box=document.getElementById("results");
  const terms=norm(value).split(" ").filter(t=>t.length>1);
  if(!terms.length){ box.innerHTML=""; return; }
  const stems=terms.map(t=>t.length>5?t.slice(0,t.length-2):t); /* грубе відсікання закінчень: «психолога» → «психолог» */
  const found=ORGS.filter(o=>stems.every(t=>o.hay.includes(t)));
  box.innerHTML = found.length
    ? `<p class="results-head">Знайдено: ${found.length}</p><div class="cards">${found.map(o=>cardHTML(o,{showSector:true,terms:stems})).join("")}</div>`
    : `<div class="empty">За запитом «${esc(value)}» нічого не знайдено. Спробуйте інше слово або <a href="#zmist">оберіть сектор послуг</a>.</div>`;
}
function renderZmist(){
  const used=SECTORS.map(s=>({...s,count:ORGS.filter(o=>o.sectors.includes(s.slug)).length})).filter(s=>s.count>0);
  $app.innerHTML = `
  <section class="page-zmist">
    ${dropSVG("left:-30px;top:-40px;width:230px")}${dropSVG("right:-20px;top:120px;width:200px;transform:scaleX(-1)")}${dropSVG("left:-40px;bottom:120px;width:210px")}
    <div class="wrap">
      <div class="zmist-top"><h1>Сектор послуг</h1><a class="back" href="#">Повернутися на головну</a></div>
      <div class="sticker-grid">
        ${used.map(s=>`<a class="sticker" href="#${s.slug}" style="--c:${s.color}"><b>${esc(s.name)}</b><span>${s.count} ${plural(s.count)}</span></a>`).join("")}
      </div>
    </div>
  </section>`;
}
const plural=n=>{ const a=n%10,b=n%100; return a===1&&b!==11?"організація":a>=2&&a<=4&&(b<12||b>14)?"організації":"організацій"; };
function renderSector(s){
  const list=ORGS.filter(o=>o.sectors.includes(s.slug));
  $app.innerHTML = `
  <section class="page-sector" style="--c:${s.color};--bg:${tint(s.color,.72)}">
    ${ringsSVG}
    <div class="wrap">
      <div class="sector-head">
        <div class="title-card"><h1>${esc(s.name)}</h1><p>${list.length} ${plural(list.length)}</p></div>
        <a class="back" href="#zmist">Повернутися на зміст</a>
      </div>
      ${list.length>5?`<div class="filter">${icons.search}<label class="sr-only" for="f">Пошук у секторі</label><input id="f" type="search" placeholder="Пошук у цьому секторі"></div>`:""}
      <div class="cards" id="list">${list.map(o=>cardHTML(o,{color:s.color})).join("") || '<div class="empty">У цьому секторі поки немає організацій.</div>'}</div>
    </div>
  </section>`;
  const f=document.getElementById("f");
  if(f) f.addEventListener("input",()=>{
    const terms=norm(f.value).split(" ").filter(t=>t.length>1).map(t=>t.length>5?t.slice(0,-2):t);
    const sub=list.filter(o=>terms.every(t=>o.hay.includes(t)));
    document.getElementById("list").innerHTML = sub.map(o=>cardHTML(o,{color:s.color,terms})).join("") || '<div class="empty">Нічого не знайдено.</div>';
  });
}

/* ---------- маршрути (#zmist, #osvita …) ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const s=SECTORS.find(x=>x.slug===h);
  if(h==="zmist") renderZmist(); else if(s) renderSector(s); else renderHome();
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current", (a.dataset.nav==="zmist"&&(h==="zmist"||s)) || (a.dataset.nav==="home"&&!h)));
  if(a11yFocus) $app.focus({preventScroll:true});
  window.scrollTo(0,0);
  document.title = (s?s.name+" — ":h==="zmist"?"Сектор послуг — ":"")+"Довідник послуг з підтримки ментального здоров'я в Олександрійській громаді";
}
let a11yFocus=false;
document.addEventListener("click",e=>{
  const b=e.target.closest(".more"); if(!b) return;
  const p=b.previousElementSibling; p.classList.toggle("clamp");
  b.textContent=p.classList.contains("clamp")?"Показати повністю":"Згорнути";
});
window.addEventListener("hashchange",()=>{ a11yFocus=true; route(); });

/* ---------- старт ---------- */
(async function init(){
  let raw=DEMO_DATA;
  if(CONFIG.csvUrl){
    try{
      const r=await fetch(CONFIG.csvUrl,{cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      raw=rowsToOrgs(parseCSV(await r.text())); usingDemo=false;
    }catch(e){ console.warn("Не вдалося завантажити таблицю, показую приклад даних",e); }
  }
  ORGS=prepare(raw);
  document.getElementById("updated").textContent = usingDemo ? "Приклад даних (прототип)" : "Дані оновлюються з таблиці автоматично";
  route();
})();
</script>
